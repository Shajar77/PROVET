  <rect width="72" height="72" fill="transparent"/>
  <!-- Orange circle ring -->
  <circle cx="36" cy="36" r="34" fill="none" stroke="#ea580c" stroke-width="2"/>
  <!-- Vertical line -->
  <line x1="36" y1="18" x2="36" y2="54" stroke="#111111" stroke-width="3"/>
  <!-- Horizontal line -->
  <line x1="18" y1="36" x2="54" y2="36" stroke="#111111" stroke-width="3"/>
  <!-- Diagonal lines -->
  <line x1="24" y1="24" x2="48" y2="48" stroke="#111111" stroke-width="2"/>
  <line x1="48" y1="24" x2="24" y2="48" stroke="#111111" stroke-width="2"/>
</svg>
